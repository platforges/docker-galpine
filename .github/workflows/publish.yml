name: Build and publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64/v8
  IMAGE_NAME: ${{ github.repository_owner }}/galpine

jobs:
  alpine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        alpine: ['3.23', '3.24', 'latest']
    steps:
    - uses: actions/checkout@v7

    - uses: docker/setup-qemu-action@v4 # glibc is cross-compiled natively; QEMU only runs the packaging stages

    - uses: docker/setup-buildx-action@v4

    - uses: docker/login-action@v4
      if: github.event_name != 'pull_request'
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        flavor: latest=false
        tags: |
          type=raw,value=${{ matrix.alpine }},enable={{is_default_branch}}
          type=semver,pattern={{version}},suffix=-alpine${{ matrix.alpine }}

    - uses: docker/build-push-action@v7
      with:
        context: .
        platforms: ${{ env.PLATFORMS }}
        build-args: ALPINE_VERSION=${{ matrix.alpine }}
        cache-from: type=gha,scope=alpine-${{ matrix.alpine }}
        cache-to: type=gha,mode=max,scope=alpine-${{ matrix.alpine }}

    # Each platform is re-exported from the builder's local cache (no rebuild)
    # and run under QEMU, so nothing is pushed unless every platform passes.
    - name: Test
      run: |
        failed=""
        for platform in $(echo "${{ env.PLATFORMS }}" | tr ',' ' '); do
          echo "::group::Test $platform"
          docker buildx build --platform "$platform" \
            --build-arg ALPINE_VERSION=${{ matrix.alpine }} \
            --load -t galpine:test .
          if docker run --rm -i --platform "$platform" galpine:test sh < test.sh; then
            echo "$platform: OK"
          else
            echo "::error::Smoke test failed on $platform"
            failed="$failed $platform"
          fi
          echo "::endgroup::"
        done
        test -z "$failed" || { echo "Failed:$failed"; exit 1; }

    - uses: docker/build-push-action@v7
      if: github.event_name != 'pull_request'
      with:
        context: .
        platforms: ${{ env.PLATFORMS }}
        build-args: ALPINE_VERSION=${{ matrix.alpine }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=alpine-${{ matrix.alpine }}
