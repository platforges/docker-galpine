name: Build and publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/galpine
  # Every platform the official alpine image is published for
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/386,linux/ppc64le,linux/riscv64,linux/s390x

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        alpine: ['3.23', '3.24', 'latest']
    steps:
      - uses: actions/checkout@v7

      # glibc is cross-compiled natively; QEMU only runs the packaging stages
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.alpine }},enable={{is_default_branch}}
            type=semver,pattern={{version}},suffix=-alpine${{ matrix.alpine }}

      - name: Build (amd64, for testing)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: ALPINE_VERSION=${{ matrix.alpine }}
          load: true
          tags: galpine:test
          cache-from: type=gha,scope=alpine-${{ matrix.alpine }}
          cache-to: type=gha,mode=max,scope=alpine-${{ matrix.alpine }}

      - name: Test
        run: docker run --rm -i galpine:test sh < test.sh

      - name: Build all platforms and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          build-args: ALPINE_VERSION=${{ matrix.alpine }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=alpine-${{ matrix.alpine }}
          cache-to: type=gha,mode=max,scope=alpine-${{ matrix.alpine }}
